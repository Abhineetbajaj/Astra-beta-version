<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#b5502f" />
    <meta
      name="description"
      content="Astra — a calm, precise Vedic astrology practice built from your real birth chart."
    />
    <title>Astra — your chart, decoded</title>
    <link rel="canonical" href="https://astraastroconsultancy.com/" />

    <!-- Open Graph / social sharing — og:site_name is what search results and AI answer engines
         prefer over guessing a display name from the domain (see CLAUDE.md's SEO/GEO/AEO note). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Astra" />
    <meta property="og:title" content="Astra — your chart, decoded" />
    <meta
      property="og:description"
      content="Astra — a calm, precise Vedic astrology practice built from your real birth chart."
    />
    <meta property="og:url" content="https://astraastroconsultancy.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Astra — your chart, decoded" />
    <meta
      name="twitter:description"
      content="Astra — a calm, precise Vedic astrology practice built from your real birth chart."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data — tells search engines and AI answer engines the site's real name is
         "Astra", independent of the domain (astraastroconsultancy.com was what was available). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Astra",
        "url": "https://astraastroconsultancy.com/",
        "description": "Astra — a calm, precise Vedic astrology practice built from your real birth chart."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Astra",
        "url": "https://astraastroconsultancy.com/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
